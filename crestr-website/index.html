<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- title + description -->
    <title>Crestr: Free & Open‑Source Hiking Route Planner</title>
    <meta name="description" content="Crest is a free, open‑source hiking route planner focused on simple, reliable footpath routing without paywalls. A work‑in‑progress project built by a student developer.">

    <!-- open graph metadata tags (facebook, discord, linkedin, reddit) -->
    <meta property="og:title" content="Crest — Free & Open‑Source Hiking Route Planner">
    <meta property="og:description" content="Plan simple, reliable hiking routes using open data. Free, open‑source, and built for hikers.">
    <meta property="og:image" content="https://crestr.co.uk/images/Crest-Logo.png">
    <meta property="og:url" content="https://crestr.co.uk">
    <meta property="og:type" content="website">

    <!-- X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Crest — Free & Open‑Source Hiking Route Planner">

    <meta name="twitter:image" content="https://crestr.co.uk/images/Crest-Logo.png">

    <!-- mobile support -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- canonical url (this helps avoid duplicate-content issues, e.g. http vs https / www vs non-www) -->
