[project]
site_name = "Crestr Documentation"
site_url = "https://docs.crestr.co.uk"          # required for sitemap, canonical URLs, OG tags — set to your real docs URL
site_description = "Documentation for Crest, a free open-source hiking route planner for Cumbria, UK."
site_author = "Abdul"
copyright = "&copy; 2026 Abdul"
repo_url = "https://github.com/abdlfc11/Crestr-Hiking-App"
repo_name = "Crestr Hiking App"

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]
variant = "modern"
logo = "assets/images/Crest-Logo.png"
favicon = "favicon.ico"
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.expand",
    "navigation.top",
    "content.code.copy",
    "content.code.annotate",
    "content.tabs.link",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

# Palette (light + dark + auto/system, three-way toggle)
[[project.theme.palette]]
media = "(prefers-color-scheme)"
[project.theme.palette.toggle]
icon = "lucide/sun-moon"
name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "amber"
[project.theme.palette.toggle]
icon = "material/brightness-7"
name = "Switch to Dark Mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "amber"
[project.theme.palette.toggle]
icon = "material/weather-night"
name = "Switch to Light Mode"


# Navigation
# ----------------------------------------------------------------------------
[[project.nav]]
Home = "index.md"

[[project.nav]]
"User Guide" = [
    { "Getting Started" = "user/getting-started.md" },
    { "Developers" = "user/developers.md" },
    { "Automatic Routing" = "user/automatic-routing.md" },
    { "Manual Routing" = "user/manual-routing.md" },
    { "Exporting Routes" = "user/exporting-routes.md" }
]

[[project.nav]]
"Technical" = [
    { "Action Log Codes" = "technical/action_log_codes.md" },
    { "Data Preprocessing" = "technical/data-preprocessing.md" },
    { "Tech Stack" = "technical/tech-stack.md" },
    { "Architecture Overview" = "technical/architecture.md" },
    { "Routing Engine (A*)" = "technical/routing-engine.md" },
    { "KDTree" = "technical/kdtree.md" },
    { "Elevation Pipeline" = "technical/elevation.md" },
    { "Backend API" = "technical/backend-api.md" },
    { "Frontend Architecture" = "technical/frontend-architecture.md" }
]

[[project.nav]]
"Roadmap" = [
    { "Overview" = "roadmap/overview.md" },
    { "2025" = "roadmap/2025.md" },
    { "2026" = "roadmap/2026.md" },
    { "2027" = "roadmap/2027.md" }
]

[[project.nav]]
"Releases" = [
    { "v0.2.9" = "releases/v0.2.9.md" },
    { "v0.2.8" = "releases/v0.2.8.md" },
    { "v0.2.7" = "releases/v0.2.7.md" },
    { "v0.2.6" = "releases/v0.2.6.md" },
    { "v0.2.5" = "releases/v0.2.5.md" },
    { "v0.2.4" = "releases/v0.2.4.md" },
    { "v0.2.3" = "releases/v0.2.3.md" },
    { "v0.2.2" = "releases/v0.2.2.md" },
    { "v0.2.1" = "releases/v0.2.1.md" },
    { "v0.2.0" = "releases/v0.2.0.md" },
    { "v0.1.0" = "releases/v0.1.0.md" }
]

[project.markdown_extensions.attr_list]
[project.markdown_extensions.admonition]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]